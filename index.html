
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana Ads - AI Cinematography Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #ffffff;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .gradient-text {
            background: linear-gradient(135deg, #fff 0%, #a5a5a5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Ripe Banana Gradient */
        .gradient-accent {
            background: linear-gradient(135deg, #facc15 0%, #ea580c 100%);
        }
        .text-banana {
            color: #facc15;
        }
        
        /* --- Banana Pro Animations --- */
        
        /* Default/Director Wiggle */
        @keyframes banana-wiggle {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        .animate-banana-wiggle { animation: banana-wiggle 1s ease-in-out infinite; }

        /* Research Scan */
        @keyframes banana-scan {
            0%, 100% { transform: translateX(-3px) rotate(-3deg); }
            50% { transform: translateX(3px) rotate(3deg); }
        }
        .animate-banana-scan { animation: banana-scan 1.5s ease-in-out infinite; }

        /* Artist Bounce */
        @keyframes banana-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.05); }
        }
        .animate-banana-bounce { animation: banana-bounce 0.8s ease-in-out infinite; }

        /* Writer Scribble */
        @keyframes banana-write {
            0% { transform: rotate(0deg) translateX(0); }
            25% { transform: rotate(-5deg) translateX(-2px); }
            50% { transform: rotate(0deg) translateX(0); }
            75% { transform: rotate(5deg) translateX(2px); }
            100% { transform: rotate(0deg) translateX(0); }
        }
        .animate-banana-write { animation: banana-write 0.5s linear infinite; }

        /* Cameraman Pulse */
        @keyframes banana-pulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.2); }
        }
        .animate-banana-pulse { animation: banana-pulse 1.5s ease-in-out infinite; }
        
        /* Voice Vibration */
        @keyframes banana-vibrate {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        .animate-banana-vibrate { animation: banana-vibrate 0.3s linear infinite; }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
